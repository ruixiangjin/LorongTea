name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS' # Exact Adoptium release metadata for build +8
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend, MySQL, Redis and RabbitMQ
        run: ./mvnw -B verify '-Dit.test=OrderIT,CatalogIT#scopesStaffReadsAndWritesToTheAssignedStore,RedisFeaturesIT,CampaignAsyncIT'
      - name: Upload failing test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

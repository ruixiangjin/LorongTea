spring:
  application:
    name: lorong-tea
  datasource:
    url: jdbc:mysql://${LORONG_DB_HOST:127.0.0.1}:${LORONG_DB_PORT:3307}/lorong_tea?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: lorong_tea
    password: ${LORONG_DB_PASSWORD:lorong-tea-local}
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      accept-float-as-int: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash

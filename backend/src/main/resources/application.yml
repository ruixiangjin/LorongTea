spring:
  application:
    name: lorong-tea
  datasource:
    url: jdbc:mysql://${LORONG_DB_HOST:127.0.0.1}:${LORONG_DB_PORT:3307}/lorong_tea?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: lorong_tea
    password: ${LORONG_DB_PASSWORD:lorong-tea-local}
  data:
    redis:
      host: ${LORONG_REDIS_HOST:127.0.0.1}
      port: ${LORONG_REDIS_PORT:6380}
      connect-timeout: 250ms
      timeout: 250ms
  rabbitmq:
    host: ${LORONG_RABBITMQ_HOST:127.0.0.1}
    port: ${LORONG_RABBITMQ_PORT:5673}
    username: ${LORONG_RABBITMQ_USER:lorong_tea}
    password: ${LORONG_RABBITMQ_PASSWORD:}
    connection-timeout: 1s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 1
        max-concurrency: 1
        prefetch: 8
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false
    deserialization:
      accept-float-as-int: false

lorong:
  redis:
    enabled: ${LORONG_REDIS_ENABLED:false}
  campaign:
    async:
      enabled: ${LORONG_CAMPAIGN_ASYNC_ENABLED:false}
    rate-limit:
      enabled: ${LORONG_CAMPAIGN_RATE_LIMIT_ENABLED:${lorong.redis.enabled}}
      permits-per-second: ${LORONG_CAMPAIGN_PERMITS_PER_SECOND:8}
      burst: ${LORONG_CAMPAIGN_BURST:4}

management:
  health:
    rabbit:
      enabled: ${lorong.campaign.async.enabled}
    redis:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: ${LORONG_MANAGEMENT_ENDPOINTS:health,metrics}
  endpoint:
    health:
    rabbit:
      enabled: ${lorong.campaign.async.enabled}
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: logstash

services:
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: lorong_tea
      MYSQL_USER: lorong_tea
      MYSQL_PASSWORD: ${LORONG_DB_PASSWORD:-lorong-tea-local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${LORONG_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${LORONG_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      LORONG_DB_HOST: mysql
      LORONG_DB_PORT: "3306"
      LORONG_DB_PASSWORD: ${LORONG_DB_PASSWORD:-lorong-tea-local}
      LORONG_REDIS_ENABLED: "true"
      LORONG_REDIS_HOST: redis
      LORONG_REDIS_PORT: "6379"
      LORONG_JWT_SECRET: ${LORONG_JWT_SECRET:-}
      LORONG_DEMO_PASSWORD: ${LORONG_DEMO_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${LORONG_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

volumes:
  mysql-data:

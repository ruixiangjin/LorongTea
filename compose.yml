services:
  mysql:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: lorong_tea
      MYSQL_USER: lorong_tea
      MYSQL_PASSWORD: ${LORONG_DB_PASSWORD:-lorong-tea-local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:${LORONG_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${LORONG_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    profiles: ["async"]
    image: rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
    hostname: lorong-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${LORONG_RABBITMQ_USER:-lorong_tea}
      RABBITMQ_DEFAULT_PASS: ${LORONG_RABBITMQ_PASSWORD:-}
    ports:
      - "127.0.0.1:${LORONG_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${LORONG_RABBITMQ_UI_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      LORONG_DB_HOST: mysql
      LORONG_DB_PORT: "3306"
      LORONG_DB_PASSWORD: ${LORONG_DB_PASSWORD:-lorong-tea-local}
      LORONG_REDIS_ENABLED: "true"
      LORONG_REDIS_HOST: redis
      LORONG_REDIS_PORT: "6379"
      LORONG_CAMPAIGN_RATE_LIMIT_ENABLED: ${LORONG_CAMPAIGN_RATE_LIMIT_ENABLED:-true}
      LORONG_CAMPAIGN_PERMITS_PER_SECOND: ${LORONG_CAMPAIGN_PERMITS_PER_SECOND:-8}
      LORONG_CAMPAIGN_BURST: ${LORONG_CAMPAIGN_BURST:-4}
      LORONG_CAMPAIGN_ASYNC_ENABLED: ${LORONG_CAMPAIGN_ASYNC_ENABLED:-false}
      LORONG_CAMPAIGN_ASYNC_DEADLINE_SECONDS: ${LORONG_CAMPAIGN_ASYNC_DEADLINE_SECONDS:-300}
      LORONG_RABBITMQ_HOST: rabbitmq
      LORONG_RABBITMQ_PORT: "5672"
      LORONG_RABBITMQ_USER: ${LORONG_RABBITMQ_USER:-lorong_tea}
      LORONG_RABBITMQ_PASSWORD: ${LORONG_RABBITMQ_PASSWORD:-}
      LORONG_MANAGEMENT_ENDPOINTS: health,metrics,prometheus
      LORONG_JWT_SECRET: ${LORONG_JWT_SECRET:-}
      LORONG_DEMO_PASSWORD: ${LORONG_DEMO_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${LORONG_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.3@sha256:ddc2493835a1509976d5e4e0c94199c4f843ce1f42dd6bcfc8231ba734a93ff7
    ports:
      - "127.0.0.1:${LORONG_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      rabbitmq:
    profiles: ["async"]
    image: rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
    hostname: lorong-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${LORONG_RABBITMQ_USER:-lorong_tea}
      RABBITMQ_DEFAULT_PASS: ${LORONG_RABBITMQ_PASSWORD:-}
    ports:
      - "127.0.0.1:${LORONG_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${LORONG_RABBITMQ_UI_PORT:-15673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
        condition: service_healthy

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.4.3@sha256:2e986801428cd689c2358605289c90ab37d2b39e24808874971f54c99bcdc412
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:${LORONG_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/lorong-dashboards:ro
    depends_on: [prometheus]

volumes:
  rabbitmq-data:
  prometheus-data:
  mysql-data:
